# Insta Seller — alohida (tekin) manzil. Sahifa va API nurulhadis.uz bilan bir xil dastur.
# Serverda: /etc/nginx/sites-available/instaseller  (sites-enabled'ga ulangan), SSL — certbot.
server {
    listen 80;
    listen [::]:80;
    server_name instaseller.108-61-117-195.sslip.io;

    root /opt/nurulhadis;
    charset utf-8;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types text/plain text/css text/xml application/xml application/json application/javascript image/svg+xml;

    location = / {
        return 302 /crm/;
    }

    location = /robots.txt {
        add_header Content-Type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # CRM (PWA): service worker va manifest har safar yangidan tekshiriladi
    location = /crm/sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    location = /crm/manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    location /crm/icons/ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
    location /crm/ {
        try_files $uri $uri/index.html =404;
    }

    location /static/ {
        alias /opt/nurulhadis/backend/staticfiles/;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        return 404;
    }
}
