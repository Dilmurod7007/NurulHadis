server {
    server_name nurulhadis.uz;

    root /opt/nurulhadis;
    charset utf-8;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types text/plain text/css text/xml application/xml application/json application/javascript application/ld+json image/svg+xml;

    location = / {
        try_files /landing/index.html =404;
    }

    location = /ru {
        return 301 /ru/$is_args$args;
    }
    location = /ru/ {
        try_files /landing/ru.html =404;
    }

    # Eski reklama havolasi: /landing -> / (query saqlanadi)
    location = /landing {
        return 301 /$is_args$args;
    }
    location /landing/ {
        return 301 /$is_args$args;
    }

    location = /robots.txt {
        try_files /robots.txt =404;
    }
    location = /sitemap.xml {
        try_files /sitemap.xml =404;
    }

    location /assets/landing/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public";
    }

    location /h/ {
        try_files $uri /index.html;
    }

    location /assets/ {
        try_files $uri =404;
    }

    location /data/ {
        try_files $uri =404;
    }

location /media/ {        alias /opt/nurulhadis/backend/media/;    }
    location /static/ {
        alias /opt/nurulhadis/backend/staticfiles/;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen [::]:443 ssl http2 ipv6only=on; # managed by Certbot
    listen 443 ssl http2; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/nurulhadis.uz/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/nurulhadis.uz/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}
server {
    if ($host = www.nurulhadis.uz) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = nurulhadis.uz) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name nurulhadis.uz www.nurulhadis.uz;
    return 404; # managed by Certbot




}

server {
    server_name www.nurulhadis.uz;
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    ssl_certificate /etc/letsencrypt/live/nurulhadis.uz/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/nurulhadis.uz/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
    return 301 https://nurulhadis.uz$request_uri;
}
